[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "function2agent-runtime"
version = "0.1.0"
description = "Spec-aware agent runtime — analysis, runtime, supervisor (Python) and the enforcement point (Go, src/proxy)"
requires-python = ">=3.12"

# FR-021: every dependency is pinned and fully resolved at build time. The
# resolved set with hashes is `requirements.lock`, which is what the images
# install from. Nothing resolves a dependency at run time; the egress policy
# denies a package fetch anyway, because it is an outbound request to a
# destination that is not the target (contracts/egress-policy.md).
#
# The runtime path deliberately has no third-party dependency. Everything below
# is a build- or test-time tool. Provider SDKs arrive with T058 and are not here
# yet, so the list is short on purpose rather than incomplete.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "PyYAML==6.0.2",
    # The type checker, pinned because a type-level guarantee that no gate runs
    # is verified on whichever laptop happens to carry a checker. INV-012's two
    # static arms locate it with `shutil.which`, so before this pin they skipped
    # in CI — the only place the guarantee matters — with a message that said so
    # outright. `tools/typecheck.py` is the gate; the arms are the negative
    # control over it.
    #
    # **2.3.0 rather than an older release, and the choice cost nothing.** The
    # error set over `src/` is identical on 1.3.0 and 2.3.0 — the same 15 errors
    # in the same 8 files before this branch's source fixes, the same 1 after —
    # so there was no greener version to pick and no reason to pin a stale one.
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
# **The gate's scope, declared here rather than in a workflow line, because a
# scope chosen to make a gate pass is the same defect one level up and belongs
# somewhere a reviewer reads.**
#
# Whole of `src/`, and the 15 errors that stood at `7496292` are what decided
# that rather than a narrow set of the modules carrying type-level guarantees.
# Fourteen were annotations disagreeing with the code under them, all cheap and
# all behaviour-preserving; they are fixed in their own commit. The fifteenth is
# an ownership question — see `.github/workflows/ci.yml`, which declares the
# error count this scope is expected to produce and fails on any movement in
# either direction.
files = ["src"]
python_version = "3.12"

# **`ignore_missing_imports` is deliberately absent.** The invocation this gate
# was scoped from carried `--ignore-missing-imports`, and it turns out to be
# doing nothing: `src/` has no third-party import, by the design FR-021 states
# in the comment above. Left on, the flag would silently absorb a stub that went
# missing rather than reporting it, which is the wrong direction for a gate.

# A `type: ignore` that has stopped suppressing anything is an instrument that
# has stopped measuring, and this repository has caught eleven of those. Two of
# the errors fixed on this branch were the other half of that defect — ignores
# naming one error code on a line where two fire.
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "linux_only: requires Linux kernel facilities (cgroup v2, mount namespaces, seccomp user notification). OD-17.",
    "privileged: requires CAP_SYS_ADMIN. Runs inside the dev/runtime image, never on a developer's host.",
]
