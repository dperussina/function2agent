# T005 — `pytest`, `go test`, the invariants suite and the corpus gates on
# every change.
#
# The split into jobs is deliberate. The invariants suite runs on its own
# because it is the fastest signal in the repository — milliseconds, no model,
# no kernel — and a contributor should not wait on a container build to learn
# that the model-judge boundary was crossed. The corpus gates run beside it for
# the same reason and with no dependency install at all.
#
# **OD-17 shapes this file.** The kernel mechanisms need a Linux host with
# cgroup v2, mount namespaces and seccomp user notification. GitHub's
# `ubuntu-latest` runner has all three, so the mechanisms run natively here
# rather than inside Docker Desktop's linuxkit VM — which is the same reason
# `tests/batteries/results/seccomp-overhead.json` records what its numbers are
# a property of. **A CI figure and a laptop figure are different measurements
# and must not be compared.**
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE IS, READ AS AN INSTRUMENT
#
# A green tick is one bit, and this repository has now caught six instruments
# that produced a clean bit over a measurement that was absent, replayed or
# unnamed. CI was the largest of them and the last to be audited. The rules
# this file is now written to, each of which closes one of those:
#
#   1. **A step that cannot show what it ran does not get to be green.** Every
#      job that measures something writes a durable record — a step summary, an
#      artifact, or both — and the step that renders it fails when there is
#      nothing to render.
#   2. **No result is replayed.** `go test` is run with `-count=1`, and the run
#      then asserts that no `(cached)` line came back, because the fix and the
#      check for the fix are different things.
#   3. **Zero outcomes is a failure, not a pass.** `go test` exits 0 over a
#      package with no test files; `pytest` exits 0 over a suite that collected
#      work and skipped all of it. Both are checked for explicitly.
#   4. **Skips are named.** `-rs` for the log, `--junitxml` plus an artifact for
#      the record, and `tools/pytest_outcomes.py` to read it back.
#   5. **Every measurement carries the kernel it was taken on.** See
#      `.github/actions/runner-identity`, and note the comment there about why
#      that is recorded per job rather than once for the run.
#
# **What none of this buys, stated so nobody reads more into a green run than
# it carries: at the time of writing `main` has no branch protection and no
# rulesets, so nothing here blocks a merge.** Every check in this file is
# advisory until somebody makes it required, and a required check is named by
# its *job name* — renaming a job silently detaches whatever rule referenced
# it. That is not a hypothetical; the job below was renamed on 2026-08-04.
#
# ---------------------------------------------------------------------------
# THE JOB BOUNDS, AND WHERE EACH NUMBER CAME FROM
#
# Every job below carries `timeout-minutes`. Until 2026-08-06 none did, so a
# hang anywhere fell through to GitHub's 360-minute default — and this workflow
# has a *documented* way to hang. `tests/removal_proofs.sh` and
# `tools/proof_attribution.py` both apply tampers that can remove the only
# thing stopping a loop, leaving the tampered test with no failure mode left.
# Finding 032 measured one at 56 minutes of continuous CPU.
#
# **These are fallbacks, not the primary bound.** The primary bound is the
# per-arm cap `tools/proof_timeout.py` applies inside both of those tools. That
# distinction sets the *floor* on the removal-proofs value, because a job
# timeout **cancels the job** and the cap's whole product is a record
# `tests/removal_proofs.sh` writes at its last line, out of a `mktemp -d` an
# `EXIT` trap removes. A bound chosen inside the window where the cap would
# fire therefore destroys the diagnostic the cap exists to produce — and not
# only for the arm that hung, but for every arm in the run.
#
# **The `if: always()` steps do run on a cancel; they find nothing to render.**
# A job timeout is a cancellation, and GitHub re-evaluates unfinished steps'
# conditions on a cancel, so `always()` stays true. Same bound, different
# mechanism. `tools/README.md` § "An outer bound inside an inner bound's
# window" is the full treatment and carries the references.
#
# **Derived from this workflow's own history rather than picked.** Job
# durations over the 40 most recent runs — 200 observations — taken as
# `completed_at - started_at` from
# `gh api repos/{owner}/{repo}/actions/runs/<id>/jobs`. Re-derived whole on
# 2026-08-08 (34 success, 6 failure), and this is the table the bounds below
# are read against:
#
#     job              n    min    med    p90    max     set
#     removal proofs  40    234  271.5    330    540    20m
#     pytest          40     10   94.5    102    146    10m
#     corpus gates    40     26   40.0     43     44     5m
#     go test         40     19   25.0     28     30     5m
#     invariants      40      7   11.0     15     26     5m
#
# The 2026-08-06 derivation it replaces (191 success, 9 failure), kept because
# the movement is the finding and one table cannot show it:
#
#     job              n    min    med    p90    max
#     removal proofs  40    183  263.5    302    318
#     pytest          40     10   90.5    100    107
#     corpus gates    40     28   39.0     42     44
#     go test         40     19   25.0     28     29
#     invariants      40      7   11.0     13     18
#
# Only `removal proofs` moved materially, 318 → 540, and its driver is now
# **measured rather than read off the diff** — see that job below, which also
# carries the arm count at which the bound stops being derivable. `pytest`
# 107 → 146 and `invariants` 18 → 26 are the same growth reaching the jobs
# that run the suite once; both stay far inside a bound that was a floor to
# begin with. `corpus gates` and `go test` did not move.
#
# **A sixth job exists and has no row, because one run is not a sample.**
# `slug-differential` first ran at `3c21260` on 2026-08-10 and took **50s**,
# 45s of it in the differential itself. That is one observation against a table
# whose every row is forty, and the quantities the rows carry — med, p90, max —
# are not defined on it. It is also the one job here whose duration is mostly
# somebody else's: 137 sequential round trips to `api.github.com`, so its
# spread is a property of that endpoint rather than of this repository, and a
# single draw says nothing about the tail a bound is set against. The figure is
# recorded rather than promoted, and the row waits for the next whole
# re-derivation.
#
# The one thing it does settle is the direction of the laptop comparison. The
# job below set its bound off 105.7s measured on an M-series laptop and said
# outright that a CI figure and a laptop figure are different measurements. They
# were, by 2.1x, and in the direction that leaves the bound conservative.
#
# **One incident window is excluded, by a rule that never looks at a
# duration.** GitHub had a critical Actions incident from 2026-08-06T15:22:49Z
# to roughly 2026-08-07T12:09Z. A run is excluded iff `[run_started_at,
# max(job.completed_at)]` intersects that interval — **11 runs, 55 job
# observations**, blind to conclusion and to how long anything took. That is
# deliberately mechanical: the alternative is deciding run by run which
# durations were GitHub's, which is the judgement a sample is supposed to
# replace. It removes seven jobs cancelled at 901–902s where runner-allocation
# wait counted against the bound rather than work — `invariants`, an 8-to-26
# second job, is three of them.
#
# **The rule is not free and not purely conservative, which is the price of
# its being mechanical.** It also drops six runs that look clean, including a
# 586s `removal proofs` observation *higher* than the retained max. Three of
# that run's five jobs were cancelled at ~902s, so 586 is not a reading of
# this repository either — but the rule did not know that, and must not.
#
# **That is a closed sample, not a running maximum.** It is the 40 eligible
# runs that existed when it was taken, and a later observation does not belong
# in it — folding one in would leave the max disagreeing with the min, median
# and p90 beside it.
#
# **5 minutes is a floor, and it is stated as one rather than dressed up as a
# derivation.** Three jobs finish in under a minute every time; for those the
# variance is runner provisioning and package download, not the work, so a
# value scaled off the work would be measuring PyPI. What the floor buys is
# real all the same: 72x tighter than the default, and it fires on a hang.
#
# Re-derive rather than nudge. The command above is the whole method, and a
# bound raised to quiet a flake has stopped measuring anything.

name: CI

on:
  push:
  pull_request:

jobs:
  invariants:
    name: invariants (milliseconds, no model)
    runs-on: ubuntu-latest
    # The floor. 18s observed max, so this is 17x — and the honest reading is
    # that the runner and one `pip install --require-hashes` are the whole of
    # the variance here, since the runner itself takes milliseconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Run the invariant runner
        run: python tests/invariants/runner.py
      - name: Does a checker still refuse a `verified` built from a provisional?
        # **A step in this job rather than a seventh job, and rather than a step
        # in `corpus gates`.** `corpus` looks cheaper — 44s max, no job name
        # added — but it is the one job here that installs nothing, and its own
        # comment says that is what keeps `tools/README.md`'s "standard library
        # only, no network" claim honest. mypy is a pip dependency, so a
        # type-check step there would falsify the property that job exists to
        # protect. This job already runs `pip install --require-hashes`, is the
        # fastest signal in the repository, and is where INV-012 lives.
        #
        # A seventh job would also need a `timeout-minutes` with no sample
        # behind it, and would add a job *name* — which is what a required
        # status check is matched on, and this file records a rename detaching
        # one silently. mypy over `src/` measures ~2s against a 5-minute floor
        # with 17x headroom already, so a job buys nothing and costs a name.
        #
        # **What this is for.** T123 made `verified` unreachable from a
        # provisional derived contract at the type level, and mypy rejects the
        # planted forbidden program. Nothing checked it: mypy was in neither
        # `requirements.lock` nor this file, so INV-012's two static arms
        # located it with `shutil.which`, failed to, and skipped — in CI, the
        # only place the guarantee matters. Those arms are the negative control
        # over this step, and this step is what makes them run.
        #
        # **Scope is whole `src/` and the scope is declared in
        # `pyproject.toml`, not here.** A scope picked to make a gate green is
        # the defect this repository keeps catching, one level up.
        run: |
          # **`set +e` is explicit and load-bearing, and leaving it out cost run
          # 31619922016.** Every `run:` in this file executes under `bash -e`,
          # and **mypy exits non-zero whenever it reports an error** — including
          # the single error this step declares as expected. So the step aborted
          # on mypy's own exit status before any assertion ran and before the
          # summary was written: it would have failed every run regardless of
          # what `src/` actually contained, which is a gate that fails for a
          # reason it is not measuring. The status is carried by hand to the last
          # line instead, the same discipline the unshare-pair and
          # slug-differential steps state in their own bodies.
          #
          # The local negative control missed it because the harness mirrored
          # this body without mirroring this shell. A laptop figure and a CI
          # figure are different measurements, and so are their shells.
          set +e
          set -uo pipefail
          # **The declared error count, and it is a bound in both directions.**
          # `src/` carries exactly one error and it is not an annotation defect:
          # `src/runtime/runner.py:252` calls `create` through
          # `LifecycleGateway`, a Protocol whose own docstring says the runtime
          # "cannot create a session". That is an ownership question — either
          # the Protocol is stale or the call reaches past the ownership map —
          # and it is routed as a task rather than settled by whoever was adding
          # a gate. It is deliberately NOT suppressed with an inline `type:
          # ignore`, because that would erase the only signal anybody has.
          #
          # Declared instead, so this step fails on any movement: a second error
          # fails it, and resolving this one fails it too and forces the number
          # down. That is `check_tampers.py`'s EXPECTED_PROOFS discipline, and
          # the alternative — a gate that tolerates "one or more" — stops
          # measuring the moment it passes.
          EXPECTED_ERRORS=1
          KNOWN='src/runtime/runner.py:252: error: "LifecycleGateway" has no attribute "create"'

          report=$(mktemp)
          # `--cache-dir` outside the workspace on purpose. `.mypy_cache` is in
          # `NOT_NEEDED_PATHS` in `tests/removal_proofs.sh` so the path
          # accounting would survive it, but it is NOT in `.gitignore`, and this
          # step writing nothing into the tree is cheaper than reasoning about
          # which of those two lists decides. Same reason the report is a
          # `mktemp` and not a file in the repository root.
          python -m mypy --no-incremental --cache-dir="$(mktemp -d)" \
            > "$report" 2>&1
          cat "$report"

          # **Zero files checked is a failure, not a pass** — this file's third
          # stated rule, and the vacuity question applies to a new gate
          # directly. A type checker pointed at nothing exits 0 and prints
          # `Success`, which is the clean-bit-over-an-absent-measurement family
          # this whole workflow is written against.
          checked=$(grep -oE '[0-9]+ source files?' "$report" \
            | head -1 | grep -oE '^[0-9]+' || true)
          if [ -z "$checked" ] || [ "$checked" -eq 0 ]; then
            echo "::error::mypy reported no file count, so it is not known that anything was checked. A checker over zero files is green."
            exit 1
          fi

          errors=$(grep -cE '^src/.+: error: ' "$report" || true)
          if [ "$errors" -ne "$EXPECTED_ERRORS" ]; then
            echo "::error::mypy reports $errors error(s) over src/; $EXPECTED_ERRORS is declared. If this is a new error, fix it. If the declared one was resolved, lower the count in ci.yml in the same commit — a gate whose expected set drifts from its actual set has stopped measuring."
            exit 1
          fi
          if ! grep -qF "$KNOWN" "$report"; then
            echo "::error::src/ carries $EXPECTED_ERRORS error as declared, but not the declared one. A different single error is not the same finding."
            exit 1
          fi
          {
            echo '### Type check — the provisional/verified barrier'
            echo
            echo "| files checked | errors | declared | the declared one |"
            echo "|---:|---:|---:|---|"
            echo "| $checked | $errors | $EXPECTED_ERRORS | \`runner.py:252\`, an open ownership question |"
            echo
            echo '```'
            cat "$report"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Explicit, because `set +e` means the step's status is whatever the
          # last command left behind. Every failing path above exits 1 by hand.
          exit 0

      - name: Are the removal proofs still pointed at anything?
        # Under a second, no pytest, no Go, no privileges. It is here, in the
        # fastest job, because the proofs' dominant failure mode is not a
        # mechanism regressing — it is a tamper string quietly ceasing to match
        # after an unrelated edit, which the harness only notices minutes later
        # in a job that needs root. Fifteen proofs rotted on 2026-08-03 because
        # nothing cheap enough to run during the work was looking.
        run: python tools/check_tampers.py

  corpus:
    # **The five hand-run gates, four of which are wired here and one of which
    # deliberately is not.** Until now every corpus claim in this repository
    # rested on an agent having remembered to run these, which is the same
    # standing as no gate at all.
    #
    # `tools/cite_advisor.py` is the one left out, and leaving it out is the
    # decision rather than an omission. It has no threshold and no finding it
    # makes changes its exit code, by design — the gate rule underneath it was
    # built, measured against 184 ablated clean cases, and rejected. Wiring an
    # advisory into a gate rebuilds exactly that rejected rule; running it
    # unggated on every push emits a permanent listing that a reader learns to
    # skip, which is how its one true positive gets lost. It stays a human-run
    # audit aid, documented in `tools/README.md` with its invocations.
    name: corpus gates (consistency, no model)
    runs-on: ubuntu-latest
    # The floor, and the tightest of the three in real terms: 44s observed max
    # is 6.8x, and this job installs nothing at all, so it has no download leg
    # for the floor to be covering.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` on purpose. `tools/README.md` states the whole
      # toolchain is "Python 3.11+, standard library only, no network", and a
      # job that installs nothing is the only thing that keeps checking it.

      - name: Do the checks fire at all?
        # First, and the ordering is the argument. `check_corpus.py` passing
        # proves nothing on its own — a validator whose regex never matches
        # passes everything, which is the failure this repository keeps
        # hitting. `selftest.py` runs the whole check set against a corpus
        # where every check must fire and one where none may.
        run: python3 tools/selftest.py

      - name: Are the thresholds the checks compare against pinned?
        # And a green self-test proves less than it looks like it proves: it
        # shows each check fires, not that the constant it fires at is the
        # constant the fixtures require. `catalog-line-count` carried
        # TOLERANCE = 2 for its whole life and the self-test could not tell it
        # from 0.
        #
        # **This is in CI because it was measured, not because it looked
        # cheap**: 34 perturbations, each a full self-test, in 5.2 seconds on
        # an M-series laptop. A sweep that costs five seconds does not need a
        # schedule.
        run: python3 tools/threshold_probe.py

      - name: The corpus gate
        # Errors only. `--warnings-as-errors` is deliberately not set here —
        # `tools/README.md` says to enable it once the warning set is cleared,
        # and the warning classes that actually fire are line counts and
        # register ranges, which go stale for a few minutes whenever a document
        # is edited without the generator being re-run. A gate that flaps gets
        # worked around. The step below prints them instead.
        run: python3 tools/check_corpus.py

      - name: The warnings, reported rather than enforced
        # A warning nobody sees is the same defect one severity down, so they
        # go on the run page. `--report-only` always exits 0; this step cannot
        # fail the job and is not trying to.
        if: always()
        run: |
          set -euo pipefail
          {
            echo '<details><summary>Corpus check — full report, warnings included</summary>'
            echo
            echo '```'
            python3 tools/check_corpus.py --report-only
            echo '```'
            echo '</details>'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Is the list of instruments still the set of instruments?
        # **Not part of the corpus check set, and not in its ordering.** It is
        # here because this is the one job that installs nothing, and
        # `tools/instruments.py` is standard-library-only for exactly that
        # reason — a census that needed PyYAML would have to live in a job that
        # pip-installs, and this job is what keeps the toolchain claim honest.
        #
        # What it closes: for a week every pass was briefed with a five-item
        # list of gates and reported all five green, while `tests/invariants/
        # runner.py` — a sixth, wired into the job above — was red and had been
        # since 7349e31. Three CI runs failed on it and only on it. Nothing
        # lied; the list was simply not the set, and nothing was checking that
        # it was. This step is what checks it.
        run: python3 tools/instruments.py --check

      - name: Are the derived claims regenerated?
        # Line counts and register ranges are machine-readable from artifacts
        # sitting beside them, and the repair is `python3 tools/gen_claims.py`
        # rather than retyping a number. This is the only thing that notices
        # the window between an edit and that command.
        run: python3 tools/gen_claims.py --check

  slug-differential:
    # **The one oracle in this repository that belongs to somebody else.**
    # `link-anchor` resolves every `#fragment` in the corpus with
    # `corpuscheck.corpus.slugify`. For as long as that function was described
    # from GitHub's documentation rather than measured against GitHub it
    # invented anchors no rendered page carried, `link-anchor` computed every
    # target with the same defect, and two committed links were written to
    # match the invention and passed a green gate. The differential closed
    # that on 2026-08-10 and then nothing was left watching, so a renderer
    # change would reopen it in exactly the same silence.
    #
    # **Non-gating, and the reason is the one already recorded in this file.**
    # The step needs outbound HTTPS to `api.github.com`, so an upstream
    # incident, a rate limit or a renderer change would redden builds while
    # saying nothing about the merge. `ci.yml` declines `--warnings-as-errors`
    # on the stated reasoning that a gate which flaps gets worked around, and a
    # network-dependent gate is that argument's strongest case. So this takes
    # the shape the unshare pair takes: `continue-on-error`, a non-zero exit
    # surfaced as a `::warning::` and a step summary. Visible, never blocking.
    #
    # **Its own job rather than a step in `corpus`, on that job's own
    # reasoning.** `corpus` is a fast signal — 44s observed max, installing
    # nothing — and the whole-corpus differential measured **105.7s** on an
    # M-series laptop at `8f15f50` on 2026-08-10, which would more than double
    # it. That job also exists partly to keep the claim that `tools/` is
    # standard-library-only with no network honest, and hanging the one
    # network-dependent instrument off it muddies what a green tick there
    # means. The harness is deliberately not in `tools/` for the same reason;
    # it is invoked at its harness path here.
    #
    # **Whole corpus rather than a subtree, measured before choosing.**
    # `--path tools` is one document and 1.6s, and it reaches **0** blockquoted
    # headings — the population that hid a defect for two differentials
    # running. A canary blind to the family that was last wrong is not a
    # canary. The full run covers 137 documents and 2,548 headings, 2,439
    # anchored at `^#` plus 109 blockquoted, and costs 137 authenticated
    # requests against a 1,000/hour budget.
    #
    # **`push` only.** On `pull_request` the checked-out SHA is a merge commit
    # this workflow did not push, and the contents endpoint renders a ref the
    # remote holds; the harness reports the miss as HTTP 404 rather than as a
    # corpus difference, which is correct behaviour and a useless annotation on
    # every PR. Renderer drift is a property of the renderer, not of a branch,
    # so observing it once per merge is the same observation.
    if: github.event_name == 'push'
    name: slugify vs GitHub's renderer (non-gating observation)
    runs-on: ubuntu-latest
    # Not scaled off the work. The observed 105.7s is a laptop figure against a
    # residential link, the runner's path to `api.github.com` is a different
    # measurement, and this job is 137 sequential round trips — so the floor is
    # set to fire on a hang rather than to bound the work. The first CI run came
    # in at 50s, which confirms the two measurements differ and leaves this
    # where it is: 18x one observation is not a derived bound, and the header
    # says why the row is still owed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install`. The harness is `urllib` and the standard library.

      - name: "`slugify` against GitHub's own renderer — NON-GATING observation"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `set +e` for the reason the unshare pair states: the run whose
          # record somebody needs is the failing one, and `bash -e` would abort
          # before anything reached the run page.
          set +e
          set -u
          python3 \
            specs/001-discovery-validation/harness/slug-differential/slug_differential.py \
            > slug-differential.txt 2>&1
          status=$?
          {
            echo '<details><summary>slugify vs GitHub'"'"'s renderer — whole corpus at this commit</summary>'
            echo
            echo '```'
            cat slug-differential.txt
            echo '```'
            echo '</details>'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=slug differential::slugify and GitHub's renderer disagree, or the differential could not run. Both are worth reading, and they are different findings: the first moves every #fragment link-anchor resolves, the second means nothing was measured. See the run summary. This does not gate the build."
          fi
          exit "$status"

  python:
    name: pytest (kernel mechanisms included)
    runs-on: ubuntu-latest
    # Wider than the floor jobs get because this is the only one that both
    # installs the full pinned lock and runs privileged kernel work under
    # `sudo`, and because its `if: always()` steps are what publish the outcome
    # record a failing run is read from.
    #
    # **The multiplier this comment used to quote was stale against the table
    # directly above it, and the framing was the defect rather than the digit.**
    # It read "107s observed max, so 5.6x". 107 is the max of the **2026-08-06**
    # closed sample; the 2026-08-08 re-derivation that replaced it reports
    # **146**, and the comment was never advanced. Both remain closed samples
    # carrying their own n and neither is a running maximum — a later
    # observation does not belong in either, because folding one in would leave
    # the max disagreeing with the min, median and p90 beside it. So no
    # multiplier is quoted here at all: the two samples are stated above and
    # this note points at them rather than transcribing a third copy that can
    # drift again.
    #
    # **A single later observation sits above both, and it is recorded as one
    # observation and not as a new maximum.** Run 31412656505 took **195s** —
    # 99s unprivileged, 84s privileged, every other step at or under 3s, read
    # per job and per step off the Actions API. Against the 600s bound that is
    # **405s of headroom**, and it is the reading the variance probe below was
    # sized against rather than a figure this file compares anything to.
    #
    # **The probe is inside that headroom and cannot leave it.** It carries its
    # own 300s total budget and launches a battery only when its 90s per-battery
    # cap could fire inside that budget, so 195 + 300 = 495s is the arithmetic
    # worst case against 600s. The expected cost is ~148s at 10 batteries of the
    # 14.83s the battery actually measures on this runner class. Re-derive the
    # table above rather than nudging this bound, and note that the probe's own
    # budget is the thing to reduce first if this job ever needs room.
    #
    # **That prediction was then tested, and it held to within 4s.** Run
    # 31415736559 ran the probe in **152s** for 10 of 10 batteries and the whole
    # job in **347s** against the 600s bound — 195 + 152, so the probe's cost
    # landed on the single observation above rather than displacing it. **253s of
    # headroom remained.** One observation again, not a maximum, and recorded
    # here because the arithmetic worst case is the thing this bound was chosen
    # against and it is now known to be conservative by 148s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # `cache:` is deliberately unset. It is opt-in on this action and
          # turning it on would restore a pip cache across commits — harmless
          # for a `--require-hashes` install, and still the wrong default in a
          # file being audited for replayed results. pytest has no result cache
          # of its own, so with `cache:` unset and `--lf`/`--ff` unused there is
          # nothing on the Python side that can serve a stale verdict.
      - run: pip install --require-hashes -r requirements.lock

      - name: Confirm the Linux facilities are present
        # OD-17 has no degraded mode. If the runner lacks a facility the run
        # fails here rather than silently skipping the tests that need it.
        #
        # **Privileged, and it has to be.** Two of these checks create a child
        # cgroup under /sys/fs/cgroup — `cgroup_delegation` because FR-049
        # requires the bound to be set from outside the environment, so the
        # supervisor owns the session cgroup before the container starts, and
        # `cgroup_kill` because the kernel puts `cgroup.kill` in non-root
        # cgroups only. The cgroup root is root-owned on an ordinary Linux
        # host, so both fail with EACCES for an unprivileged process.
        # Confirmed locally against a `--cgroupns=host` container running as
        # uid 1000: both report `Permission denied`. Running the gate
        # unprivileged therefore asserts a capability the supervisor does not
        # run with, which is the wrong question in the other direction.
        #
        # Its output goes to the run page as well as the log. The kernel floor
        # is 5.14, it is DERIVED and NOT TESTED with T205 open, and preflight
        # is the one place that owns both the floor and its provenance — so the
        # summary quotes preflight rather than restating a version number that
        # would then drift.
        #
        # `set -e` is deliberately absent and the status is carried by the last
        # line, the same discipline `tests/removal_proofs.sh` states in its own
        # header. Under `-e` a failing preflight would abort before the summary
        # was written, and the failing run is the one whose facility list
        # somebody needs. Note also that every `run:` here executes under
        # `bash -e` **without** `pipefail`, so a pipeline's left-hand status is
        # discarded unless it is asked for — hence `PIPESTATUS`.
        run: |
          set -uo pipefail
          sudo -E env "PATH=$PATH" python -m src.supervisor.preflight 2>&1 \
            | tee preflight.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Linux facility preflight'
            echo
            echo '```'
            cat preflight.txt
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: The unshare pair, unprivileged and privileged — NON-GATING observation
        # The step above runs the preflight under `sudo`, and that is correct
        # for a gate: the supervisor runs privileged, so an unprivileged run
        # would assert a capability it never needs. But it means CI has never
        # exercised the classifier's unprivileged path, and one cell of that
        # path is the one nobody here has been able to construct.
        #
        # Finding 025 leaves `kernel-sysctl-or-lsm` **derived, not measured**.
        # It could not be built on the measuring host: Docker Desktop's
        # linuxkit VM carries neither AppArmor nor SELinux, so no LSM is there
        # to refuse anything. It is also the cell most likely to fire in
        # production — Ubuntu 24.04 ships
        # `kernel.apparmor_restrict_unprivileged_userns` enabled, and this
        # runner *is* Ubuntu 24.04. Root is exempt from that restriction, which
        # is exactly why the `sudo` preflight above has never produced it.
        #
        # So: run the same committed checks unprivileged on this same VM. If
        # the cell appears, a derived classification becomes a measured one at
        # no hardware cost.
        #
        # **`continue-on-error` is the whole design, not a convenience.** What
        # this measures is a property of a GitHub-hosted runner image, not of
        # this repository's code. A runner-image change flipping that sysctl
        # would break every build here while saying nothing about the merge —
        # so this cannot gate. But `continue-on-error` alone would let it fail
        # silently, and the renderer exits non-zero on a missing record, which
        # surfaces as an annotated step and a `::warning::` rather than as
        # nothing at all. Non-gating, still visible.
        #
        # **Both arms, or neither is readable.** The positive result here is a
        # *refusal*, and a refusal is what a broken import, a failed fork, or a
        # probe that can never succeed all produce too. The privileged arm on
        # the same VM, differing in privilege and nothing else, is the negative
        # control that separates those — Rule 8 of the `experiment-design`
        # skill, and the discipline finding 025's own NC-1..NC-7 follow.
        #
        # **FALSIFIED, run 30970910828 (2026-08-05) — and the step stays as
        # written.** The unprivileged arm reported `namespaces=available` at
        # `euid=1001 CapEff=0000000000000000`, with
        # `apparmor_restrict_unprivileged_userns` reading **`1`** and AppArmor
        # present in `/sys/kernel/security/lsm`. So the switch is on, the LSM is
        # loaded, no capability was held, and the namespace was created anyway.
        # `PREDICTED_LAYER` is deliberately NOT updated to match — see the
        # paragraph below, which is the instruction this run was a test of. The
        # `kernel-sysctl-or-lsm` cell therefore remains unconstructed on every
        # surface available to this project, and it is now open whether this
        # probe can construct it at all: Ubuntu's restriction may permit the
        # `unshare` and confine the result, moving the refusal to the `uid_map`
        # write. Finding 026's correction result 7 carries the full readings and
        # the two candidate mechanisms. The `_apparmor_policy()` readings added
        # to the tool are what the next run needs to separate them.
        #
        # **The prediction is derived and may be wrong.** It is written into
        # `tools/unshare_pair_observation.py` as `PREDICTED_LAYER` before the
        # run, and whatever comes out is published beside it. If the arm
        # reports something else, that is the result. Do not tune this step
        # until it agrees; an experiment with one acceptable outcome measures
        # nothing.
        if: always()
        continue-on-error: true
        run: |
          # `set +e` is explicit and load-bearing. Every `run:` here executes
          # under `bash -e`, so a failing arm would abort the step before the
          # other arm ran and before anything reached the run page — and the
          # failing run is precisely the one whose record somebody needs. The
          # status is carried by hand to the last line instead, the same
          # discipline `tests/removal_proofs.sh` states in its own header.
          set +e
          set -u
          # The unprivileged arm is this shell's own posture; the privileged
          # arm is taken *inside* the sudo wrapper, so `euid: 0` is a reading
          # rather than a claim about an invocation. Finding 024's overflow-uid
          # bug is what happens when a posture is inferred instead of read.
          python3 tools/unshare_pair_observation.py \
            --label unprivileged --out unshare-pair-unprivileged.json
          sudo -E env "PATH=$PATH" python3 tools/unshare_pair_observation.py \
            --label 'privileged (sudo)' --out unshare-pair-privileged.json
          python3 tools/unshare_pair_observation.py --render \
            unshare-pair-unprivileged.json \
            unshare-pair-privileged.json \
            >> "$GITHUB_STEP_SUMMARY"
          rendered=$?
          if [ "$rendered" -ne 0 ]; then
            echo "::warning title=unshare-pair observation::An arm left no record, so the observation did not happen. See the run summary. This does not gate the build."
          fi
          exit "$rendered"

      - name: Collect the whole suite, so the two halves can be checked against it
        # The suite is run as two disjoint halves and the pair is taken for the
        # whole. Nothing verified that it is. A marker expression that stopped
        # selecting a file leaves those tests in neither half, and both halves
        # stay green because each is internally complete. This is the third
        # observation that makes the comparison possible.
        run: |
          set -euo pipefail
          python -m pytest tests -q --collect-only | tee pytest-collected.txt

      - name: Unprivileged suite
        # `-rs` names every skip in the log. `--junitxml` is the durable half:
        # the log for run 30919927355 turned out to be unreachable through
        # `gh`, so a reason that exists only there is a reason nobody can read.
        run: >
          python -m pytest tests -q -rs -m "not privileged"
          --junitxml=pytest-unprivileged.xml

      - name: Privileged suite — FR-048, FR-049, FR-050
        # The identity is captured *under the same `sudo` wrapper* as the suite
        # rather than asserted beside it, because the euid this half runs at is
        # the whole reason it is a separate half. A line reading `euid: 0`
        # written by the unprivileged shell would be a claim, not a reading.
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" python -c 'import json,os,platform;json.dump({"euid":os.geteuid(),"uid":os.getuid(),"kernel":platform.release(),"machine":platform.machine(),"platform":platform.platform(),"python":platform.python_version(),"what_this_is":"observed inside the sudo wrapper that ran the privileged suite and the seccomp-overhead measurement; the figures in this artifact are a property of it"},open("privileged-suite-identity.json","w"),indent=2,sort_keys=True)'
          sudo -E env "PATH=$PATH" python -m pytest tests -q -rs -m privileged \
            --junitxml=pytest-privileged.xml

      - name: What the two halves actually ran
        # `436 passed, 1 skipped` names no skip, and a privileged test that
        # skipped for want of a kernel facility is indistinguishable in that
        # sentence from one that ran. This renders the JUnit reports and fails
        # for the three things a pytest exit status cannot express: a missing
        # report, a half that collected nothing, and a half that collected work
        # and skipped all of it.
        if: always()
        run: |
          set -euo pipefail
          python3 tools/pytest_outcomes.py \
            --collected pytest-collected.txt \
            unprivileged=pytest-unprivileged.xml \
            privileged=pytest-privileged.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: The kernel-native seccomp-overhead figure
        # `tests/batteries/test_seccomp_overhead.py` writes this on every
        # ordinary privileged run and the privileged suite runs here, so CI has
        # been producing a **kernel 6.17 native** figure and destroying it with
        # the runner every time. It is gitignored, its `print()` is swallowed
        # by `pytest -q`, and nothing uploaded it.
        #
        # **Captured, not committed.** `tests/batteries/results/
        # seccomp-overhead.json` is Q-09's recorded figure, taken on
        # `6.12.76-linuxkit`; this one is a different measurement on a
        # different kernel. They are not a before and an after and must not be
        # subtracted. Re-recording stays a deliberate act
        # (`F2A_RECORD_MEASUREMENTS=1`).
        #
        # Absence is a failure rather than a warning: the file is missing
        # exactly when the measurement did not happen, which is the state this
        # step exists to make visible.
        if: always()
        run: |
          set -euo pipefail
          figure=tests/batteries/results/seccomp-overhead.latest.json
          if [ ! -s "$figure" ]; then
            {
              echo '### seccomp overhead — NOT PRODUCED'
              echo
              echo "The privileged suite finished and left no figure at \`$figure\`."
              echo 'That file is written by the measurement fixture itself, so its'
              echo 'absence means the measurement did not run — most likely the'
              echo 'battery skipped. The skip list above names why.'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '### seccomp overhead — measured natively on this runner'
            echo
            echo 'Not committed. The recorded Q-09 figure is'
            echo "\`tests/batteries/results/seccomp-overhead.json\` and was taken on"
            echo 'Docker/linuxkit 6.12; this is a different measurement on a'
            echo 'different kernel. The record below carries its own environment'
            echo 'and its own caveats — read those before comparing anything.'
            echo
            echo '```json'
            cat "$figure"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The battery's within-run variance — NON-GATING observation
        # **Q-09's noise floor, and the only construction that measures it.**
        # `REPEATS = 5` means each battery run takes five samples and publishes
        # their median, so repeating the whole battery k times *inside this one
        # job* gives k medians-of-5 with the runner, kernel, architecture, core
        # count and boot held fixed. Tight medians put the residual variation at
        # the whole-run level, where raising `REPEATS` cannot reach it; wide
        # medians mean raising it buys something real. Either answer settles the
        # constant, and the battery's own note names this as the measurement
        # that would.
        #
        # It is what `notification_rate`'s refused magnitude bound was refused
        # for want of: the sign test's boundary is zero because the quantity's
        # definition forbids crossing it, and a *magnitude* bound needs a
        # measured floor rather than a chosen constant. **This step measures the
        # floor and installs nothing.**
        #
        # **`continue-on-error` is the design, exactly as it is for the unshare
        # pair above.** What this measures is the variance of a timing
        # measurement on a shared cloud runner; a noisy neighbour on the
        # hypervisor moves it and says nothing about the merge. A gate that
        # fails because a variance probe was noisy is a gate that gets disabled.
        # The renderer still exits non-zero on a missing record, which surfaces
        # as an annotated step and a `::warning::` rather than as nothing.
        #
        # **Bounded inside itself, not guarded by a conditional after it.** A
        # job timeout cancels the job and `always()` steps then run and find
        # nothing to render, so a conditional is no protection — the probe
        # carries a per-battery cap via `tools/proof_timeout.py` and a total
        # budget, and it launches a battery only when the cap could fire inside
        # that budget. Its wall clock is therefore bounded by the budget and not
        # by k times the cap.
        #
        # **The numbers are measured against this job rather than picked.** The
        # battery costs **14.83s on this runner class** — read off run
        # 31412656505's `pytest-privileged.xml`, where the module-scoped fixture
        # puts its whole cost on the first test that requests it and the other
        # seven cases report 0.000s. That run's job took **195s against the 600s
        # bound** (99s unprivileged, 84s privileged, every other step ≤3s), so
        # there is **405s of headroom**. k=10 costs ~148s of it, leaving the
        # 300s budget as a ceiling the probe cannot exceed: 195 + 300 = 495s
        # inside 600s. **k is chosen on the statistic — 45 pairwise gaps per
        # arm — and not on the budget, which would have permitted k≈25.**
        #
        # **It runs after the gating figure has been rendered, and it restores
        # what it borrows.** The probe overwrites
        # `seccomp-overhead.latest.json` once per battery by construction, so it
        # saves the privileged suite's copy first and restores it last. Without
        # that, the figure published above as the suite's would silently become
        # this probe's last battery.
        if: always()
        continue-on-error: true
        run: |
          # `set +e` explicit and load-bearing, the same discipline the unshare
          # pair step states: every `run:` here executes under `bash -e`, so a
          # non-zero probe would abort before anything reached the run page, and
          # the failing run is the one whose record somebody needs.
          set +e
          set -u
          sudo -E env "PATH=$PATH" python3 tools/seccomp_variance_probe.py \
            --take --k 10 \
            --out tests/batteries/results/seccomp-variance.latest.json
          python3 tools/seccomp_variance_probe.py --render \
            tests/batteries/results/seccomp-variance.latest.json \
            >> "$GITHUB_STEP_SUMMARY"
          rendered=$?
          if [ "$rendered" -ne 0 ]; then
            echo "::warning title=seccomp within-run variance::The probe left no record, so the observation did not happen. See the run summary. This does not gate the build."
          fi
          exit "$rendered"

      - name: Keep the outcome record and the native figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-outcomes-and-native-overhead
          path: |
            pytest-collected.txt
            pytest-unprivileged.xml
            pytest-privileged.xml
            privileged-suite-identity.json
            preflight.txt
            unshare-pair-unprivileged.json
            unshare-pair-privileged.json
            tests/batteries/results/seccomp-overhead.latest.json
            tests/batteries/results/seccomp-variance.latest.json
          if-no-files-found: error
          retention-days: 90

  removal-proofs:
    # **No `?` in this name, and that is not a style preference.** GitHub strips
    # `?` from the paths inside a run's log archive, and `gh` finds a job's log
    # by matching those paths against the job name — so while this job was
    # called `removal proofs (do the tests catch removal?)`, `gh run view --job
    # ... --log` returned **zero bytes with no error**, and `gh run view --log`
    # omitted the job entirely. Run 30919927355 was green and its harness output
    # was, to anyone reaching for it that way, gone. The bytes were on the blob
    # store the whole time (`/actions/jobs/<id>/logs` served 30,047 of them);
    # nothing anyone would type could reach them.
    #
    # A `?` in a *step* name is harmless — the invariants job has one and
    # retrieves fine, because the match is on the job folder, not the step file.
    # The artifact and step summary below are the durable fix; this rename only
    # restores the ordinary route.
    name: removal proofs (do the tests catch removal)
    runs-on: ubuntu-latest
    # **Derived, not scaled — this is the one job where the per-arm cap sets
    # the floor.** 540s observed max, plus 300s for one arm reaching
    # `REMOVAL_PROOF_TIMEOUT` in the harness below, plus 300s for the same arm
    # reaching the same cap again in `tools/proof_attribution.py`, is 1140s =
    # 19 minutes. That is the longest a run can legitimately take *and still
    # leave the record its `if: always()` steps exist to publish*. The harness
    # writes that record from exactly two places — the baseline abort, and the
    # line after the last proof — out of a `mktemp -d` an `EXIT` trap removes,
    # so a cancelled harness leaves nothing for **any** arm. The `always()`
    # steps below do run on a cancel and find nothing to render, which reaches
    # the same bound by a better route; `tools/README.md` § "An outer bound
    # inside an inner bound's window" has it in full.
    #
    # 20 minutes leaves 660s of hang budget over that observed max — 2.2 cap
    # firings, where the 2026-08-06 derivation had 882s and 2.9. Three
    # simultaneously hanging arms still exceed it, and that is the right place
    # to give up: at three the cap is not containing the problem and the
    # fallback is supposed to fire.
    #
    # **The trend did continue and the whole table was re-derived, which is
    # what the previous note here asked for. The bound still does not move.**
    # 1140s is inside 1200s, so the file's own method returns a floor below the
    # value already set, and nothing has fired — 0 failures, 0 cap firings in
    # every record pulled. Widening on that evidence is the "raised to quiet a
    # flake" move the header forbids, and it is not free: hang budget is the
    # thing a wider bound spends.
    #
    # **The driver is arm count, and it is now measured rather than read off
    # the diff.** Every run's `removal-proofs.latest.json` artifact carries
    # `totals.entries_recorded`, and `proof-attribution.txt` carries one
    # `claims` line per arm; the two agree exactly, so the job runs the tamper
    # set twice and one regressor covers both passes. Over 49 successful
    # eligible runs spanning 64–202 arms:
    #
    #     duration = 96s + 1.68s/arm     R² = 0.80, resid sd 27s
    #
    # **But 1.68 is an average over a range where the slope is not constant,
    # and quoting it alone would understate the next arm.** Restricting to the
    # top of the range steepens it monotonically — 1.96 s/arm above 98 arms,
    # 2.71 above 120, **2.98 above 129**, 3.85 above 147. Each arm re-runs a
    # selection out of a suite that is itself growing (507 → 1194 outcomes over
    # the same runs), so arms and suite size are collinear and a fit on both
    # returns a *negative* per-outcome coefficient — an artifact, not a
    # finding. The honest figure is the local one: **~3.0s per arm at present
    # arm counts.**
    #
    # **What that buys is a threshold instead of a vigil.** The floor above is
    # `observed_max + 600`, so it reaches 1200s when a run reaches 600s, which
    # at 202 arms / 540s and ~3.0s per arm is **≈222 arms**. That is ~20 arms
    # away, and the sample grew 64 → 202 in four days. So: **when
    # `totals.entries_recorded` reaches 222, this bound stops being derivable
    # and must be re-derived — not when someone notices a slow run.** The note
    # this replaces had no number in it and depended on exactly that noticing.
    #
    # Raising `REMOVAL_PROOF_TIMEOUT` without raising this trades the cap's
    # diagnostic for a cancelled job. They move together.
    timeout-minutes: 20
    # A passing suite says the code works. It does not say the tests would
    # notice if a mechanism were deleted, and that is the property this
    # repository's rules actually require. Left out of CI, the proofs rot
    # silently as the source moves under their tamper strings — thirteen of them
    # had drifted by the end of Phase 2 and every one reported as a gap in the
    # tests rather than as a broken proof. The harness now fails a tamper that
    # matches nothing, which is what makes this job worth running.
    #
    # **The harness refuses to report a number in an environment it cannot
    # measure in.** It runs the whole suite untampered first and aborts with exit
    # 2 if pytest produced no outcomes at all. Without that, a runner whose
    # dependency install had silently failed would score every arm non-zero and
    # publish a perfect result; that was run for real on a developer host and
    # reported 48 proved, 0 unproven, having tested nothing. `set -e` is not in
    # this script, so the exit status is carried explicitly by its last line.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache-dependency-path: src/proxy/go.sum
      - run: pip install --require-hashes -r requirements.lock
      - name: Prove the tests fail when the mechanism is removed
        # Privileged so the kernel-mechanism arms are attempted rather than
        # skipped; a skipped proof is reported as skipped and not as proved.
        #
        # That last clause is the whole reason this job exists, and until the
        # two steps below it was **not checkable from a finished run**. A green
        # tick is one bit. It cannot separate `61 proved` from `57 proved, 4
        # skipped`, and those are different claims about the kernel mechanisms.
        # The harness now also writes a JSON record of every arm; see its header
        # and `tools/removal_proofs_summary.py`.
        run: sudo -E env "PATH=$PATH" bash tests/removal_proofs.sh

      - name: Publish the totals to the run page
        # `if: always()` because the reading that matters most is the one from a
        # run that failed. The renderer exits non-zero when there is no record
        # to read — a harness step that went green without leaving one is the
        # unauditable state this job is being repaired out of, so it must not
        # itself be green.
        if: always()
        run: |
          python3 tools/removal_proofs_summary.py \
            --render tests/batteries/results/removal-proofs.latest.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Which test each tamper actually breaks
        # The harness's verdict is one word per proof. It cannot separate "the
        # test noticed the mechanism was gone" from "something broke" — a
        # tamper that edits the wrong thing fails a test and reads exactly like
        # a real proof. Closing that needs attribution, attribution is a
        # reading task with no threshold in it, and a reading nobody can
        # reconstruct after the runner is destroyed is a reading nobody does.
        #
        # **It is here rather than in a manual workflow because of what it
        # costs and what it needs.** It needs privileged Linux, pytest and a Go
        # toolchain, all of which this job has already paid for, and it takes
        # under a minute. A manual workflow carrying that setup would be run by
        # nobody, and its evidence is per-tree: it cannot be re-derived for a
        # commit after the fact.
        #
        # **It still fails nothing.** Its only non-zero exit is the baseline
        # abort — the same refusal the harness above makes, for the same
        # reason — and no finding it reports changes its status.
        if: always()
        run: |
          set -uo pipefail
          sudo -E env "PATH=$PATH" python3 tools/proof_attribution.py 2>&1 \
            | tee proof-attribution.txt
          status=${PIPESTATUS[0]}
          {
            echo '<details><summary>Proof attribution — the test each tamper breaks</summary>'
            echo
            echo '```'
            cat proof-attribution.txt
            echo '```'
            echo '</details>'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the per-proof record
        # Gitignored locally (`*.latest.json`), so the artifact is the only copy
        # that outlives the runner. Retained long enough to compare two runs on
        # different kernels, which is the comparison the record exists for.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removal-proofs-record
          path: |
            tests/batteries/results/removal-proofs.latest.json
            proof-attribution.txt
          if-no-files-found: warn
          retention-days: 90

  go:
    name: go test (the enforcement point)
    runs-on: ubuntu-latest
    # The floor. 29s observed max is 10x, and every one of those observations
    # was taken with a warm `setup-go` cache; a cold module download plus a
    # `-race` build is the variance the floor is here to absorb.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-identity
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache-dependency-path: src/proxy/go.sum
      - name: Vet
        working-directory: src/proxy
        run: go vet ./...
      - name: Test
        # ---------------------------------------------------------------------
        # **`-count=1`, and it is the difference between a result and a replay.**
        #
        # Run 30919927355's Go job printed `ok …/src/proxy (cached)` and
        # executed **no test**. `actions/setup-go`'s cache key is
        # `…-go-1.24.3-<hash of go.sum>` — it does not include the source — so
        # `GOCACHE` is restored across commits and Go's own content addressing
        # then decides whether to re-run. All 223 outcomes, the whole egress
        # enforcement point among them, were served from the cache the previous
        # run left behind. `-count=1` bypasses the test cache outright.
        #
        # **Two things make this worse than an ordinary cache hit, and both
        # were confirmed by running them rather than reasoned about.** Go's
        # verbose output is cached with the result, so `go test -v` replays all
        # 223 `--- PASS:` lines from a run that did not happen — a log full of
        # passing tests is not evidence any of them ran. And `-race` is a
        # *stochastic* detector: a data race that surfaces on some fraction of
        # runs gets sampled once and then replayed indefinitely, so caching does
        # not merely skip work, it freezes one draw from a distribution.
        #
        # **The assertion below is not decoration.** A fix and a check that the
        # fix took are different things, and `-count=1` is one flag away from
        # being dropped by someone speeding the job up. If a `(cached)` line
        # ever comes back, this step fails.
        #
        # **And `-count=1` does not close the other hole.** `go test ./...`
        # exits **0** over a package with no test files — verified by deleting
        # every `*_test.go` and running it — so an accidentally-empty test set
        # is green. The outcome count and the `[no test files]` check are what
        # catch that. The count is published rather than compared against a
        # constant, because a hardcoded 223 is the stale-transcribed-number
        # defect that `catalog-line-count` exists to catch, one file over.
        # ---------------------------------------------------------------------
        working-directory: src/proxy
        run: |
          set -uo pipefail
          go test ./... -race -count=1 -v 2>&1 | tee go-test.txt
          status=${PIPESTATUS[0]}

          if grep -q '(cached)' go-test.txt; then
            echo "::error::a Go test result was replayed from the build cache despite -count=1"
            exit 1
          fi
          if grep -qE '^\?[[:space:]].*\[no test files\]' go-test.txt; then
            echo "::error::a package under ./... has no test files; go test exits 0 over it"
            grep -E '^\?[[:space:]]' go-test.txt
            exit 1
          fi

          outcomes=$(grep -cE '^ *--- (PASS|FAIL|SKIP): ' go-test.txt || true)
          skipped=$(grep -cE '^ *--- SKIP: ' go-test.txt || true)
          if [ "$outcomes" -eq 0 ]; then
            echo "::error::go test reported zero outcomes; nothing was executed"
            exit 1
          fi
          {
            echo '### go test — the enforcement point'
            echo
            echo "| outcomes | skipped | replayed from cache |"
            echo "|---:|---:|---|"
            echo "| $outcomes | $skipped | none — \`-count=1\`, asserted |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$skipped" -gt 0 ]; then
            {
              echo "#### $skipped Go test(s) skipped, named"
              echo
              grep -E '^ *--- SKIP: ' go-test.txt \
                | sed -e 's/^ *--- SKIP: /- /' -e 's/ (.*$//'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Keep the Go outcome list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-outcomes
          path: src/proxy/go-test.txt
          if-no-files-found: error
          retention-days: 90
      - name: Build the single static binary
        working-directory: src/proxy
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/f2a-proxy ./...
