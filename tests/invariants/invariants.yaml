# T022 — the versioned, machine-checkable invariants file.
#
# Constitution Principle II's second paragraph, adopted by plan.md as an
# obligation the specification did not state. Every entry carries an
# identifier, the principle or requirement it discharges, and the test that
# checks it.
#
# Two rules about this file, both enforced by T198's reconciliation pass:
#   1. Every invariant here has a test.
#   2. Every test in tests/invariants/ has an invariant here.
#
# And one rule about the tests themselves, which is the harder one and the one
# this corpus has been burned by: **a passing fixture is not evidence a
# mechanism works.** Each entry below names a `removal_proof` — the specific
# edit that must make the test fail. A test with no removal proof is a test
# that would pass against an empty implementation.

# The removal proofs named below are also executable as a set:
#     bash tests/removal_proofs.sh
# which edits each mechanism out of a copy of the tree, runs the test that is
# supposed to depend on it, and reports UNPROVEN for any test that still passes.

schema_version: "1.0.0"
version: "1.6.0"
updated: "2026-08-12"

