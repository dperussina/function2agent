  - id: INV-008
    discharges: FR-014, FR-050
    statement: >
      The supervisor and the enforcement point agree about the capability
      boundary. The digest is SHA-256 over the presented handle string as
      bytes — not over the bytes the hex decodes to — and the session table's
      column names are what the proxy queries. Both are cross-language
      agreements that nothing structural enforces, and both fail totally and
      silently: every request denied capability_not_honoured, with no partial
      signal to notice it by. The Python arm asserts the committed fixture is
      what today's supervisor produces; the Go arm reads that same
      supervisor-written database with the production read-only store.
    test: tests/unit/test_session_conformance.py
    also: src/proxy/conformance_test.go
    removal_proof: >
      Four, all in tests/removal_proofs.sh — change capability_digest to hash
      the decoded bytes on either side, rename capability_sha256 in the proxy's
      query, or make stage 1 check only the lease and not the state.
    runtime: milliseconds
    model_in_loop: false

  - id: INV-009
    discharges: FR-035, FR-054, data-model.md
    statement: >
      Every logical table has exactly one writing role, every row carries the
      tenant and deployment scope, and the scope comes from the repository
      rather than the caller. The structural arm reads the ownership map; the
      concurrent arm opens one database from several roles at once and asserts
      a non-owner's write is refused rather than serialised behind the owner's.
      A separate arm scans src/ for engine-specific SQL above the repository
      layer, because a single raw statement is how the single-writer rule and
      the scope columns both get bypassed at the same time.
    test: tests/invariants/test_writer_ownership.py
    removal_proof: >
      Two, both in tests/removal_proofs.sh — make require_write a no-op in
      src/contracts/ownership.py, or drop the scope-column guard from
      Repository.insert so a caller can supply its own tenant_id.
    runtime: milliseconds
    model_in_loop: false

  - id: INV-010
    discharges: T-08, FR-007, data-model.md §2.2
    statement: >
      A turn's parallel tool calls are recorded in the provider's declared
      index order and never in completion order, and no declared merge rule
      can lose a concurrent write. Every shared key names a rule in advance;
      an undeclared key is refused rather than resolved by position, and every
      declared rule either reflects every contribution or refuses naming both
      branches. Finding 006 measured both hazards — 5 distinct orderings in 8
      runs, and one of two parallel writes to a shared key vanishing with no
      error and no warning — but it measured them on ADK, which OD-15 dropped.
      The hazard is the providers' and the mitigation is now ours, so this is
      an invariant with a known-real hazard and no measurement behind it.
    test: tests/invariants/test_fanout_ordering.py
    removal_proof: >
      Four, all in tests/removal_proofs.sh — record on completion instead of
      on the declared prefix, return the results in completion order, make
      MergePolicy.rule_for fall back to a last-write-wins rule, or make
      single_writer pick a winner instead of refusing. The last reproduces
      finding 006's silent lost update exactly.
    runtime: milliseconds
    model_in_loop: false

  # Added 2026-08-09. T096 built this invariant's test and all six of its
  # removal-proof arms and did not write the entry, so from 7349e31 onwards
  # reconciliation failed and the CI job that runs it was red — abca043,
  # 821ef70 and 6cdd4a5 all failed here and only here. The entry is what was
  # missing; the mechanism was already whole.
  - id: INV-011
    discharges: FR-021
    statement: >
      The image the sandbox runs from ships with every dependency already
      resolved and hashed against the lock file, and ships no way to resolve
      another: no package manager, no index URL, no credential-shaped
      variable, no build secret, no fetch, and no entrypoint of its own. It
      also asserts those properties on itself at build time.

      **This is a static reading of the committed Dockerfile and is
      deliberately not an egress claim.** FR-021 and the egress policy are one
      control (research.md §T-11); nothing here denies anything, and one test
      exists specifically to fail if a future edit makes this reading open a
      socket. Two things it cannot see, stated so the entry is not read as
      more than it is: a package manager arriving from a base image change,
      which alters no line of the file, and whatever the built image actually
      contains. The Dockerfile's own build-time RUN block covers the first and
      runs only where somebody builds an image — CI builds none, which is why
      this static arm is the whole of FR-021's shipping clause in CI, and why
      test_the_image_asserts_its_own_properties_at_build_time exists to stop
      the other arm being deleted as redundant.

      Every prohibition here is paired with a synthetic Dockerfile that
      violates it, because a scanner that finds nothing and a scanner looking
      in the wrong place are the same green run.
    test: tests/invariants/test_sandbox_image.py
    removal_proof: >
      Six, all in tests/removal_proofs.sh and all landed with T096 — drop
      --require-hashes from deploy/images/sandbox.Dockerfile; or in
      src/sandbox/image_policy.py make the teardown-ordering test
      order-blind, drop the shipped-stage narrowing from the index-URL rule,
      stop joining line continuations, read the first FROM as the stage that
      ships, or start every scan with asserts_at_build_time already true.
    runtime: milliseconds
    model_in_loop: false

  # T123. The runtime half of this sentence already existed in
  # src/contracts/result.py and had done since T021, which is why this entry is
  # about **unreachability** rather than about a second check. A caller can
  # reach a runtime `if` with the forbidden pair already in hand; what it
  # cannot do is construct a Verified with nothing to pass as issued_by.
  - id: INV-012
    discharges: constitution Principle I (v1.1.0), FR-026, FR-022
    statement: >
      A provisional derived contract can produce NOT VERIFIABLE and never
      VERIFIED, and the prohibition is carried by the types rather than by a
      check. ProvisionalContract and ValidatedContract are distinct types with
      no inheritance between them, Verified names ValidatedContract in its own
      constructor, and no method on ProvisionalContract returns Verified —
      asserted by introspection over the annotations so a method added later
      is covered without anyone updating a list.

      Verified additionally requires a check that recomputes and a
      RecomputationAgreement carrying two values it compares itself. That is
      what keeps T124 and T132 open: a shape-and-type-only control verifier
      holds no recomputation and so cannot reach VERIFIED at all, which is
      what T132 will assert over an injected fault corpus. Conformance to a
      declared shape is explicitly not verification (FR-022).

      **Two halves, and one of them is not gated here.** The static half — a
      type checker rejecting the forbidden program — is exercised by a planted
      forbidden construction paired with a clean control, because a green
      type-check is a positive result whose meaning is the absence of a failure
      signal and needs a planted failure to mean anything. mypy is not in this
      project's venv and no gate runs a type checker, so that arm **skips with
      a named reason** where mypy is absent rather than passing over nothing.
      The construction half needs no checker and is what the remaining arms
      assert.

      One residual is asserted rather than fixed: Result.provisional is a bool
      defaulting to False, the unsafe value, so Result(VERIFIED, payload) with
      the flag omitted stays constructible. The type that carries it is
      T126/T127's, and the arm records the defect executably so it is not
      rediscovered.
    test: tests/invariants/test_provisional_never_verified.py
    removal_proof: >
      Five, all in tests/removal_proofs.sh. In src/analysis/validate.py: make
      ProvisionalContract a subclass of ValidatedContract so every signature
      demanding the second accepts the first; drop the issued_by type refusal
      in Verified.__post_init__; drop the recomputes() refusal so a shape-only
      check can reach VERIFIED; accept an unequal pair in
      RecomputationAgreement; or drop its float refusal so an undefined
      precision is compared silently.
    runtime: milliseconds
    model_in_loop: false

  # T126/T127/T128. The FR-024 pass ruled that RefusalReason does not belong in
  # src/analysis/validate.py and proved it by planting the import and reading a
  # hard ImportError. The ruling was right and the enforcement was an accident:
  # it held only because src/runtime/verify.py imports src/analysis/validate.py,
  # so the reverse edge was a cycle. Remove that one import in any unrelated
  # change and the layering becomes unenforced with nothing to report it. This
  # entry is what the ruling rests on instead, and it was landed in the commit
  # that moved the result record — which is the change that would otherwise have
  # been free to put a caller-visible record in src/runtime/ and drag
  # src/analysis/ up after it.
  - id: INV-013
    discharges: FR-024, FR-025
    statement: >
      The package layering under src/ is declared, and no module-level import
      goes up it. src/contracts is the lowest layer; src/analysis, src/supervisor
      and src/sandbox sit above it; src/runtime sits above those and has zero
      inbound edges. The generality was measured rather than assumed: every one
      of the three forbidden directions into src/runtime is forbidden for the
      same concrete reason, that src/runtime already imports that package, so
      the edge would be a load-time cycle.

      The load-bearing arm is the one that plants a tree with the downward
      import ABSENT, so no cycle exists and a bare interpreter would accept the
      upward edge. The rule still reports it. Without that arm this file would
      be re-proving the accident it was written to replace.

      Scope is module-level imports, because that is what a load-time cycle is
      made of. The one deliberate deferred upward import — migrations reaching
      src/analysis/served_operations inside a function — is enumerated and
      checked in the forbidding direction too, so a second one is a visible
      edit and a declaration outliving its import fails rather than going quiet.
      Not covered: an upward dependency expressed without an import.
    test: tests/invariants/test_layering.py
    removal_proof: >
      Two, both in tests/removal_proofs.sh — collapse the layer comparison in
      upward_edges so an equal-or-higher destination is accepted, or make the
      walk read every node instead of tree.body so the declared deferred import
      is reported and the rule fires on the tree's one legitimate escape.
    runtime: milliseconds
    model_in_loop: false
